          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for field, value in (
              ("commit", observed),
              ("version", version),
              ("tag", tag),
              ("repository", os.environ["GITHUB_REPOSITORY"]),
          ):
              if manifest.get(field) != value:
                  raise SystemExit(f"manifest {field} is {manifest.get(field)!r}, not {value!r}")

          remote_tree = os.environ["REMOTE_TREE"]
          if not re.fullmatch(r"[0-9a-f]{40}", remote_tree):
              raise SystemExit(f"the public commit tree is not an object id: {remote_tree!r}")
          if manifest.get("tree") != remote_tree:
              raise SystemExit(
                  f"manifest tree {manifest.get('tree')!r} is not the public tree {remote_tree!r}"
              )
          if os.environ["REMOTE_WORKFLOW_ENCODING"] != "base64":
              raise SystemExit(
                  "the public workflow content is not base64: "
                  f"{os.environ['REMOTE_WORKFLOW_ENCODING']!r}"
              )
          # GitHub documents line separators inside its Base64 content. Only those are removed,
          # and decoding is strict, so trailing garbage or bad padding cannot slip through.
          encoded = os.environ["REMOTE_WORKFLOW_B64"].replace("\n", "")
          if not encoded:
              raise SystemExit("the public workflow content is empty")
          try:
              workflow_bytes = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"the public workflow content is not decodable: {error}") from error
          if not workflow_bytes:
              raise SystemExit("the public workflow content is empty")
          remote_workflow = hashlib.sha256(workflow_bytes).hexdigest()
          if manifest.get("workflow_sha256") != remote_workflow:
              raise SystemExit(
                  f"manifest workflow digest {manifest.get('workflow_sha256')!r} is not the public "
                  f"workflow digest {remote_workflow!r}"
              )

          if os.environ["PUBLIC_MAIN_HEAD"] != observed:
              raise SystemExit(
                  f"public default branch head {os.environ['PUBLIC_MAIN_HEAD']!r} is not {observed!r}"
              )
          if os.environ["TAG_OBJECT_TYPE"] != "tag":
              raise SystemExit(
                  f"tag {tag!r} is not an annotated tag object: {os.environ['TAG_OBJECT_TYPE']!r}"
              )
          if os.environ["TAG_PEELED_TYPE"] != "commit":
              raise SystemExit(f"tag {tag!r} does not peel to a commit object")
          if os.environ["TAG_PEELED"] != observed:
              raise SystemExit(
                  f"annotated tag peels to {os.environ['TAG_PEELED']!r}, not {observed!r}"
              )

          expected_names = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
          }
          stored = {row["filename"]: row for row in manifest["artifacts"]}
          if set(stored) != expected_names:
              raise SystemExit(f"manifest does not describe the release pair: {sorted(stored)}")
          present = sorted(path.name for path in (root / "dist").iterdir() if path.is_file())
          if present != sorted(expected_names):
              raise SystemExit(f"distribution directory is not exactly the pair: {present}")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"SHA256SUMS.txt must hold exactly two lines, got {len(lines)}")
          checksums = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              checksums[name] = digest
          for name, row in stored.items():
              blob = (root / "dist" / name).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"{name} does not match the stored hash")
              if len(blob) != row["size"]:
                  raise SystemExit(f"{name} does not match the stored size")
              if checksums.get(name) != row["sha256"]:
                  raise SystemExit(f"SHA256SUMS.txt does not describe {name}")
          print("public identity and stored bytes agree")
          PY

      - name: Publish to PyPI
        if: ${{ steps.remote_state.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-artifacts/dist/

  pypi_verify:
    name: verify PyPI publication anonymously
    needs: pypi_publish
    if: ${{ inputs.mode == 'staged-release' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-artifacts

      - name: Poll the index and download both files
        env:
          INDEX_JSON_URL: https://pypi.org/pypi/metrifid/${{ inputs.release_version }}/json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          def exact_rows(payload, expected_names):
              """Validate the index file list before any mapping collapses a duplicate row."""
              if not isinstance(payload, dict):
                  raise SystemExit("index response is not an object")
              rows = payload.get("urls")
              if not isinstance(rows, list):
                  raise SystemExit("index response has no file list")
              seen = {}
              for row in rows:
                  if not isinstance(row, dict):
                      raise SystemExit("index row is not an object")
                  name = row.get("filename")
                  if not isinstance(name, str) or name not in expected_names:
                      raise SystemExit(f"index row has an unexpected filename: {name!r}")
                  if name in seen:
                      raise SystemExit(f"index lists {name!r} more than once")
                  digests = row.get("digests")
                  if not isinstance(digests, dict):
                      raise SystemExit(f"index row for {name!r} carries no digests")
                  digest = digests.get("sha256")
                  if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
                      raise SystemExit(f"index row for {name!r} has a malformed digest")
                  url = row.get("url")
                  if not isinstance(url, str) or not url.startswith("https://"):
                      raise SystemExit(f"index row for {name!r} has no https url")
                  seen[name] = digest
              return seen

          root = pathlib.Path("release-artifacts")
          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          expected = {row["filename"]: row["sha256"] for row in manifest["artifacts"]}
          deadline = time.monotonic() + 300
          last = "no response yet"
          payload: dict[str, object] = {}
          while True:
              try:
                  with urllib.request.urlopen(os.environ["INDEX_JSON_URL"], timeout=30) as response:
                      payload = json.load(response)
                  # A malformed, extra or duplicated row is immutable and unsafe, so exact_rows
                  # raises rather than letting the deadline expire on a state that cannot heal.
                  observed = exact_rows(payload, set(expected))
                  if observed == expected:
                      break
                  wrong = sorted(n for n, d in observed.items() if expected[n] != d)
                  if wrong:
                      raise SystemExit(f"the index holds a different digest for {wrong}")
                  # Only a correct subset of the expected pair is ordinary propagation.
                  last = f"index is still missing {sorted(set(expected) - set(observed))}"
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f"index lookup failed with HTTP {error.code}")
                  last = "index reports 404"
              if time.monotonic() >= deadline:
                  raise SystemExit(f"timed out waiting for the index; last observed: {last}")
              time.sleep(15)

          target = pathlib.Path("downloaded")
          target.mkdir(exist_ok=True)
          for row in payload["urls"]:
              with urllib.request.urlopen(row["url"], timeout=60) as response:
                  body = response.read()
              if hashlib.sha256(body).hexdigest() != expected[row["filename"]]:
                  raise SystemExit(f"downloaded {row['filename']} does not match the original")
              if body != (root / "dist" / row["filename"]).read_bytes():
                  raise SystemExit(f"downloaded {row['filename']} is not byte-identical")
              (target / row["filename"]).write_bytes(body)
          print("both remote files are byte-identical to the originals")
          PY

      - name: Install the public wheel and run the public journeys
        run: |
          set -euo pipefail
          PUBLIC_VENV="$RUNNER_TEMP/metrifid-pypi-venv"
          rm -rf "$PUBLIC_VENV"
          python -m venv "$PUBLIC_VENV"
          "$PUBLIC_VENV/bin/python" -m pip install \
            "downloaded/metrifid-${RELEASE_VERSION}-py3-none-any.whl"
          "$PUBLIC_VENV/bin/python" -m pip check
          test "$("$PUBLIC_VENV/bin/python" -c 'import metrifid; print(metrifid.__version__)')" \
            = "${RELEASE_VERSION}"
          for surface in "" certify compare audit-timestep review-model qualify-workload \
              review-runtime run-runtime-review; do
            if [ -z "$surface" ]; then
              "$PUBLIC_VENV/bin/metrifid" --help > /dev/null
            else
              "$PUBLIC_VENV/bin/metrifid" "$surface" --help > /dev/null
            fi
          done
          JOURNEY="$RUNNER_TEMP/metrifid-pypi-journey"
          rm -rf "$JOURNEY"; mkdir -p "$JOURNEY"
          cd "$JOURNEY"
          PATH="$PUBLIC_VENV/bin:$PATH" PYTHONPATH= "$PUBLIC_VENV/bin/python" -m metrifid.demo > /dev/null
          PATH="$PUBLIC_VENV/bin:$PATH" PYTHONPATH= "$PUBLIC_VENV/bin/python" - <<'PY'
          import pathlib
          import subprocess

          baseline = pathlib.Path("baseline.xml")
          candidate = pathlib.Path("candidate.xml")
          baseline.write_text(
              '<mujoco model="journey">\n'
              "  <worldbody>\n"
              '    <body name="arm" pos="0 0 1">\n'
              '      <geom name="link" type="capsule" size="0.04 0.2" mass="1.5"/>\n'
              '      <joint name="shoulder" type="hinge" axis="0 1 0"/>\n'
              "    </body>\n"
              "  </worldbody>\n"
              "</mujoco>\n",
              encoding="utf-8",
          )
          candidate.write_text(
              '<mujoco model="journey">\n'
              "  <worldbody>\n"
              '    <body pos="0 0 1" name="arm">\n'
              '      <geom mass="1.5" name="link" size="0.04 0.2" type="capsule"/>\n'
              '      <joint axis="0 1 0" name="shoulder" type="hinge"/>\n'
              "    </body>\n"
              "  </worldbody>\n"
              "</mujoco>\n",
              encoding="utf-8",
          )
          done = subprocess.run(
              ["metrifid", "certify", str(baseline), str(candidate), "--output", "receipt"],
              capture_output=True,
              text=True,
          )
          if done.returncode != 0:
              raise SystemExit(f"certify journey exited {done.returncode}: {done.stderr}")
          published = sorted(path.name for path in pathlib.Path("receipt").rglob("*") if path.is_file())
          if not published:
              raise SystemExit("certify journey published no receipt")
          print(f"certify journey published {len(published)} receipt files")
          PY

  github_release:
    name: finalize the GitHub release
    needs: pypi_verify
    if: ${{ inputs.mode == 'staged-release' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.planned_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-artifacts

      - name: Require public identity after approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GH_REPO}" --jq '.default_branch')"
          test -n "$default_branch"
          PUBLIC_MAIN_HEAD="$(gh api "repos/${GH_REPO}/commits/${default_branch}" --jq '.sha')"
          REMOTE_TREE="$(gh api "repos/${GH_REPO}/commits/${EXPECTED_COMMIT}" --jq '.commit.tree.sha')"
          REMOTE_WORKFLOW_B64="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.content')"
          REMOTE_WORKFLOW_ENCODING="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.encoding')"
          TAG_OBJECT_TYPE="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.type')"
          TAG_OBJECT_SHA="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.sha')"
          if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
            TAG_PEELED="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
            TAG_PEELED_TYPE="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.type')"
          else
            TAG_PEELED=""
            TAG_PEELED_TYPE=""
          fi
          export PUBLIC_MAIN_HEAD REMOTE_TREE REMOTE_WORKFLOW_B64 REMOTE_WORKFLOW_ENCODING
          export TAG_OBJECT_TYPE TAG_PEELED TAG_PEELED_TYPE
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("release-artifacts")
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          expected = os.environ["EXPECTED_COMMIT"]
          observed = os.environ["GITHUB_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit(f"expected commit is not a full commit id: {expected!r}")
          if expected != observed:
              raise SystemExit(f"expected commit {expected!r} is not the run commit {observed!r}")

          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for field, value in (
              ("commit", observed),
              ("version", version),
              ("tag", tag),
              ("repository", os.environ["GITHUB_REPOSITORY"]),
          ):
              if manifest.get(field) != value:
                  raise SystemExit(f"manifest {field} is {manifest.get(field)!r}, not {value!r}")

          remote_tree = os.environ["REMOTE_TREE"]
          if not re.fullmatch(r"[0-9a-f]{40}", remote_tree):
              raise SystemExit(f"the public commit tree is not an object id: {remote_tree!r}")
          if manifest.get("tree") != remote_tree:
              raise SystemExit(
                  f"manifest tree {manifest.get('tree')!r} is not the public tree {remote_tree!r}"
              )
          if os.environ["REMOTE_WORKFLOW_ENCODING"] != "base64":
              raise SystemExit(
                  "the public workflow content is not base64: "
                  f"{os.environ['REMOTE_WORKFLOW_ENCODING']!r}"
              )
          # GitHub documents line separators inside its Base64 content. Only those are removed,
          # and decoding is strict, so trailing garbage or bad padding cannot slip through.
          encoded = os.environ["REMOTE_WORKFLOW_B64"].replace("\n", "")
          if not encoded:
              raise SystemExit("the public workflow content is empty")
          try:
              workflow_bytes = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"the public workflow content is not decodable: {error}") from error
          if not workflow_bytes:
              raise SystemExit("the public workflow content is empty")
          remote_workflow = hashlib.sha256(workflow_bytes).hexdigest()
          if manifest.get("workflow_sha256") != remote_workflow:
              raise SystemExit(
                  f"manifest workflow digest {manifest.get('workflow_sha256')!r} is not the public "
                  f"workflow digest {remote_workflow!r}"
              )

          if os.environ["PUBLIC_MAIN_HEAD"] != observed:
              raise SystemExit(
                  f"public default branch head {os.environ['PUBLIC_MAIN_HEAD']!r} is not {observed!r}"
              )
          if os.environ["TAG_OBJECT_TYPE"] != "tag":
              raise SystemExit(
                  f"tag {tag!r} is not an annotated tag object: {os.environ['TAG_OBJECT_TYPE']!r}"
              )
          if os.environ["TAG_PEELED_TYPE"] != "commit":
              raise SystemExit(f"tag {tag!r} does not peel to a commit object")
          if os.environ["TAG_PEELED"] != observed:
              raise SystemExit(
                  f"annotated tag peels to {os.environ['TAG_PEELED']!r}, not {observed!r}"
              )

          expected_names = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
          }
          stored = {row["filename"]: row for row in manifest["artifacts"]}
          if set(stored) != expected_names:
              raise SystemExit(f"manifest does not describe the release pair: {sorted(stored)}")
          present = sorted(path.name for path in (root / "dist").iterdir() if path.is_file())
          if present != sorted(expected_names):
              raise SystemExit(f"distribution directory is not exactly the pair: {present}")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"SHA256SUMS.txt must hold exactly two lines, got {len(lines)}")
          checksums = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              checksums[name] = digest
          for name, row in stored.items():
              blob = (root / "dist" / name).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"{name} does not match the stored hash")
              if len(blob) != row["size"]:
                  raise SystemExit(f"{name} does not match the stored size")
              if checksums.get(name) != row["sha256"]:
                  raise SystemExit(f"SHA256SUMS.txt does not describe {name}")
          print("public identity and stored bytes agree")
          PY

      - name: Determine the release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOOKUP_RESPONSE: ${{ runner.temp }}/release-lookup.http
        run: |
          set -euo pipefail
          # The identity step above has already proved authenticated repository access, so only the
          # exact status of this release-by-tag resource can mean absence.
          if gh api --include "repos/${GH_REPO}/releases/tags/${PLANNED_TAG}" > "$LOOKUP_RESPONSE"; then
            echo "release lookup returned a success status"
          else
            echo "release lookup returned a non-success status; the status line decides"
          fi
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          # Exactly one of absent, draft or published. Authentication, network, rate-limit,
          # malformed and unexpected statuses are fatal and authorize no mutation.
          raw = pathlib.Path(os.environ["LOOKUP_RESPONSE"]).read_text(encoding="utf-8", errors="replace")
          parts = re.split(r"\r?\n\r?\n", raw, maxsplit=1)
          head = parts[0]
          body = parts[1] if len(parts) > 1 else ""
          status_line = head.splitlines()[0] if head.strip() else ""
          match = re.match(r"HTTP/[0-9.]+ ([0-9]{3})", status_line)
          if match is None:
              raise SystemExit(f"release lookup returned no status line: {status_line!r}")
          status = int(match.group(1))
          if status == 404:
              state = "absent"
          elif status == 200:
              try:
                  release = json.loads(body)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"release lookup returned malformed JSON: {error}") from error
              if not isinstance(release, dict) or not isinstance(release.get("draft"), bool):
                  raise SystemExit("release lookup response has no draft field")
              state = "draft" if release["draft"] else "published"
          else:
              raise SystemExit(f"release lookup returned HTTP {status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"state={state}\n")
          print(f"release state is {state}")
          PY

      - name: Create the release as a draft when absent
        if: ${{ steps.release_state.outputs.state == 'absent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/metrifid-public-assets"
          rm -rf "$ASSETS"; mkdir -p "$ASSETS"
          cp "release-artifacts/dist/metrifid-${RELEASE_VERSION}-py3-none-any.whl" "$ASSETS/"
          cp "release-artifacts/dist/metrifid-${RELEASE_VERSION}.tar.gz" "$ASSETS/"
          cp release-artifacts/SHA256SUMS.txt "$ASSETS/"
          test "$(find "$ASSETS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          gh release create "$PLANNED_TAG" \
            --repo "$GH_REPO" \
            --title "metrifid ${RELEASE_VERSION}" \
            --notes-file release-artifacts/RELEASE_NOTES.md \
            --verify-tag \
            --draft \
            "$ASSETS"/*

      - name: Verify the complete release contract before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STATE: ${{ runner.temp }}/metrifid-release-precheck
          EXPECT_DRAFT: ${{ steps.release_state.outputs.state == 'published' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_STATE"; mkdir -p "$RELEASE_STATE"
          gh release view "$PLANNED_TAG" --repo "$GH_REPO" \
            --json tagName,isDraft,isPrerelease,name,body,assets > "$RELEASE_STATE/release.json"
          gh release download "$PLANNED_TAG" --repo "$GH_REPO" --dir "$RELEASE_STATE"
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          # One complete release contract, used unchanged before and after publication. The only
          # difference between the two runs is the draft state each expects.
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          state = pathlib.Path(os.environ["RELEASE_STATE"])
          root = pathlib.Path("release-artifacts")
          release = json.loads((state / "release.json").read_text(encoding="utf-8"))
          allowlist = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
              "SHA256SUMS.txt",
          }

          if release["tagName"] != tag:
              raise SystemExit(f"release tag is {release['tagName']!r}, not {tag!r}")
          if release["name"] != f"metrifid {version}":
              raise SystemExit(f"release title is {release['name']!r}")
          if release["isPrerelease"] is not False:
              raise SystemExit("a stable release must not be marked as a prerelease")

          expected_draft = os.environ["EXPECT_DRAFT"] == "true"
          if release["isDraft"] is not expected_draft:
              raise SystemExit(f"release draft state is {release['isDraft']!r}")

          # One narrow normalization: GitHub returns the body without a terminal newline. Nothing
          # else about the body is normalized, so internal whitespace stays meaningful.
          expected_body = (root / "RELEASE_NOTES.md").read_text(encoding="utf-8")
          observed_body = release["body"]
          if observed_body != expected_body and observed_body != expected_body.removesuffix("\n"):
              raise SystemExit("release body does not equal the curated notes")

          asset_names = {asset["name"] for asset in release["assets"]}
          if asset_names != allowlist:
              raise SystemExit(f"release assets are not exactly the allowlist: {sorted(asset_names)}")
          downloaded = {p.name for p in state.iterdir() if p.is_file()} - {"release.json"}
          if downloaded != allowlist:
              raise SystemExit(f"downloaded assets are not exactly the allowlist: {sorted(downloaded)}")

          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for row in manifest["artifacts"]:
              blob = (state / row["filename"]).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"published {row['filename']} does not match the accepted hash")
              if blob != (root / "dist" / row["filename"]).read_bytes():
                  raise SystemExit(f"published {row['filename']} is not byte-identical")
          published_sums = (state / "SHA256SUMS.txt").read_bytes()
          if published_sums != (root / "SHA256SUMS.txt").read_bytes():
              raise SystemExit("published SHA256SUMS.txt does not equal the accepted file")
          lines = published_sums.decode("utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"published SHA256SUMS.txt must hold two lines, got {len(lines)}")
          mapping = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              mapping[name] = digest
          if mapping != {row["filename"]: row["sha256"] for row in manifest["artifacts"]}:
              raise SystemExit("published SHA256SUMS.txt does not describe the release pair")
          print(f"complete release contract matches with isDraft={release['isDraft']}")
          PY

      - name: Require public identity again immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GH_REPO}" --jq '.default_branch')"
          test -n "$default_branch"
          PUBLIC_MAIN_HEAD="$(gh api "repos/${GH_REPO}/commits/${default_branch}" --jq '.sha')"
          REMOTE_TREE="$(gh api "repos/${GH_REPO}/commits/${EXPECTED_COMMIT}" --jq '.commit.tree.sha')"
          REMOTE_WORKFLOW_B64="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.content')"
          REMOTE_WORKFLOW_ENCODING="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.encoding')"
          TAG_OBJECT_TYPE="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.type')"
          TAG_OBJECT_SHA="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.sha')"
          if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
            TAG_PEELED="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
            TAG_PEELED_TYPE="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.type')"
          else
            TAG_PEELED=""
            TAG_PEELED_TYPE=""
          fi
          export PUBLIC_MAIN_HEAD REMOTE_TREE REMOTE_WORKFLOW_B64 REMOTE_WORKFLOW_ENCODING
          export TAG_OBJECT_TYPE TAG_PEELED TAG_PEELED_TYPE
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("release-artifacts")
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          expected = os.environ["EXPECTED_COMMIT"]
          observed = os.environ["GITHUB_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit(f"expected commit is not a full commit id: {expected!r}")
          if expected != observed:
              raise SystemExit(f"expected commit {expected!r} is not the run commit {observed!r}")

          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for field, value in (
              ("commit", observed),
              ("version", version),
              ("tag", tag),
              ("repository", os.environ["GITHUB_REPOSITORY"]),
          ):
              if manifest.get(field) != value:
                  raise SystemExit(f"manifest {field} is {manifest.get(field)!r}, not {value!r}")

          remote_tree = os.environ["REMOTE_TREE"]
          if not re.fullmatch(r"[0-9a-f]{40}", remote_tree):
              raise SystemExit(f"the public commit tree is not an object id: {remote_tree!r}")
          if manifest.get("tree") != remote_tree:
              raise SystemExit(
                  f"manifest tree {manifest.get('tree')!r} is not the public tree {remote_tree!r}"
              )
          if os.environ["REMOTE_WORKFLOW_ENCODING"] != "base64":
              raise SystemExit(
                  "the public workflow content is not base64: "
                  f"{os.environ['REMOTE_WORKFLOW_ENCODING']!r}"
              )
          # GitHub documents line separators inside its Base64 content. Only those are removed,
          # and decoding is strict, so trailing garbage or bad padding cannot slip through.
          encoded = os.environ["REMOTE_WORKFLOW_B64"].replace("\n", "")
          if not encoded:
              raise SystemExit("the public workflow content is empty")
          try:
              workflow_bytes = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"the public workflow content is not decodable: {error}") from error
          if not workflow_bytes:
              raise SystemExit("the public workflow content is empty")
          remote_workflow = hashlib.sha256(workflow_bytes).hexdigest()
          if manifest.get("workflow_sha256") != remote_workflow:
              raise SystemExit(
                  f"manifest workflow digest {manifest.get('workflow_sha256')!r} is not the public "
                  f"workflow digest {remote_workflow!r}"
              )

          if os.environ["PUBLIC_MAIN_HEAD"] != observed:
              raise SystemExit(
                  f"public default branch head {os.environ['PUBLIC_MAIN_HEAD']!r} is not {observed!r}"
              )
          if os.environ["TAG_OBJECT_TYPE"] != "tag":
              raise SystemExit(
                  f"tag {tag!r} is not an annotated tag object: {os.environ['TAG_OBJECT_TYPE']!r}"
              )
          if os.environ["TAG_PEELED_TYPE"] != "commit":
              raise SystemExit(f"tag {tag!r} does not peel to a commit object")
          if os.environ["TAG_PEELED"] != observed:
              raise SystemExit(
                  f"annotated tag peels to {os.environ['TAG_PEELED']!r}, not {observed!r}"
              )

          expected_names = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
          }
          stored = {row["filename"]: row for row in manifest["artifacts"]}
          if set(stored) != expected_names:
              raise SystemExit(f"manifest does not describe the release pair: {sorted(stored)}")
          present = sorted(path.name for path in (root / "dist").iterdir() if path.is_file())
          if present != sorted(expected_names):
              raise SystemExit(f"distribution directory is not exactly the pair: {present}")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"SHA256SUMS.txt must hold exactly two lines, got {len(lines)}")
          checksums = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              checksums[name] = digest
          for name, row in stored.items():
              blob = (root / "dist" / name).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"{name} does not match the stored hash")
              if len(blob) != row["size"]:
                  raise SystemExit(f"{name} does not match the stored size")
              if checksums.get(name) != row["sha256"]:
                  raise SystemExit(f"SHA256SUMS.txt does not describe {name}")
          print("public identity and stored bytes agree")
          PY

      - name: Publish the verified draft as the final mutation
        if: ${{ steps.release_state.outputs.state != 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$PLANNED_TAG" --repo "$GH_REPO" --draft=false

      - name: Verify the complete release contract after publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STATE: ${{ runner.temp }}/metrifid-release-postcheck
          EXPECT_DRAFT: "false"
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_STATE"; mkdir -p "$RELEASE_STATE"
          gh release view "$PLANNED_TAG" --repo "$GH_REPO" \
            --json tagName,isDraft,isPrerelease,name,body,assets > "$RELEASE_STATE/release.json"
          gh release download "$PLANNED_TAG" --repo "$GH_REPO" --dir "$RELEASE_STATE"
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          # One complete release contract, used unchanged before and after publication. The only
          # difference between the two runs is the draft state each expects.
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          state = pathlib.Path(os.environ["RELEASE_STATE"])
          root = pathlib.Path("release-artifacts")
          release = json.loads((state / "release.json").read_text(encoding="utf-8"))
          allowlist = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
              "SHA256SUMS.txt",
          }

          if release["tagName"] != tag:
              raise SystemExit(f"release tag is {release['tagName']!r}, not {tag!r}")
          if release["name"] != f"metrifid {version}":
              raise SystemExit(f"release title is {release['name']!r}")
          if release["isPrerelease"] is not False:
              raise SystemExit("a stable release must not be marked as a prerelease")

          expected_draft = os.environ["EXPECT_DRAFT"] == "true"
          if release["isDraft"] is not expected_draft:
              raise SystemExit(f"release draft state is {release['isDraft']!r}")

          # One narrow normalization: GitHub returns the body without a terminal newline. Nothing
          # else about the body is normalized, so internal whitespace stays meaningful.
          expected_body = (root / "RELEASE_NOTES.md").read_text(encoding="utf-8")
          observed_body = release["body"]
          if observed_body != expected_body and observed_body != expected_body.removesuffix("\n"):
              raise SystemExit("release body does not equal the curated notes")

          asset_names = {asset["name"] for asset in release["assets"]}
          if asset_names != allowlist:
              raise SystemExit(f"release assets are not exactly the allowlist: {sorted(asset_names)}")
          downloaded = {p.name for p in state.iterdir() if p.is_file()} - {"release.json"}
          if downloaded != allowlist:
              raise SystemExit(f"downloaded assets are not exactly the allowlist: {sorted(downloaded)}")

          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for row in manifest["artifacts"]:
              blob = (state / row["filename"]).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"published {row['filename']} does not match the accepted hash")
              if blob != (root / "dist" / row["filename"]).read_bytes():
                  raise SystemExit(f"published {row['filename']} is not byte-identical")
          published_sums = (state / "SHA256SUMS.txt").read_bytes()
          if published_sums != (root / "SHA256SUMS.txt").read_bytes():
              raise SystemExit("published SHA256SUMS.txt does not equal the accepted file")
          lines = published_sums.decode("utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"published SHA256SUMS.txt must hold two lines, got {len(lines)}")
          mapping = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              mapping[name] = digest
          if mapping != {row["filename"]: row["sha256"] for row in manifest["artifacts"]}:
              raise SystemExit("published SHA256SUMS.txt does not describe the release pair")
          print(f"complete release contract matches with isDraft={release['isDraft']}")
          PY
