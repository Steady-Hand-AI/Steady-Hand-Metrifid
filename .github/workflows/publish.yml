name: publish

# Publication is manual, staged, and fail-closed. There is no tag-push trigger and no automatic path
# to any registry: an operator must dispatch this workflow and choose `staged-release` explicitly.
#
# `validate-only` performs no publication and mutates no external state. It is not offline: building
# and installing distributions contacts package indexes for dependencies.
#
# Actions artifacts in a public repository are readable by anyone with repository read access, so the
# artifact carried between jobs holds only release-bound, public-safe files. Reports and logs stay on
# the runner that produced them.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build and validate only, or run the staged external release.
        type: choice
        required: true
        default: validate-only
        options:
          - validate-only
          - staged-release
      release_version:
        description: Canonical stable release version, for example 1.2.3.
        type: string
        required: true
      expected_commit:
        description: Full 40-character commit SHA this release must be built from.
        type: string
        required: true
      planned_tag:
        description: Annotated tag that must already point at the expected commit.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  PLANNED_TAG: ${{ inputs.planned_tag }}
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_ARTIFACT: metrifid-${{ inputs.release_version }}-release
  PRIMARY_MUJOCO: "3.12.0"

jobs:
  workflow_contract:
    name: workflow contract test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run the durable workflow contract test
        run: |
          set -euo pipefail
          python -m pip install -c .github/quality-constraints.txt pytest pyyaml
          python -m pytest -q .github/tests/test_publish_workflow.py

  build_and_validate:
    name: build and validate release artifacts
    needs: workflow_contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Require a canonical stable version and the exact requested commit
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          expected = os.environ["EXPECTED_COMMIT"]
          observed = os.environ["GITHUB_SHA"]

          # One canonical stable PEP 440 release segment: numeric, no leading `v`, no leading-zero
          # segment, and no dev, local, pre-release or post-release suffix of any kind.
          canonical = re.compile(r"(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*))+")
          if canonical.fullmatch(version) is None:
              raise SystemExit(f"release version is not a canonical stable version: {version!r}")
          if tag != version:
              raise SystemExit(f"planned tag {tag!r} does not equal release version {version!r}")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit(f"expected commit is not a full commit id: {expected!r}")
          if expected != observed:
              raise SystemExit(f"expected commit {expected!r} is not the checked-out {observed!r}")

          namespace: dict[str, object] = {}
          exec(pathlib.Path("src/metrifid/version.py").read_text(encoding="utf-8"), namespace)
          source_version = namespace["__version__"]
          if source_version != version:
              raise SystemExit(
                  f"source version {source_version!r} does not equal release version {version!r}"
              )
          PY
          test -z "$(git status --porcelain)"

      - name: Install the constrained release toolchain
        run: |
          set -euo pipefail
          python -m pip install -c .github/quality-constraints.txt \
            build editables hatchling hypothesis mypy numpy pytest pytest-check pytest-randomly \
            pyyaml ruff twine "mujoco==${PRIMARY_MUJOCO}"

      - name: Quality gates
        run: |
          set -euo pipefail
          python -m ruff check --no-cache .
          python -m ruff format --check --no-cache .
          python -m mypy --strict src/metrifid

      - name: Build the original sdist and wheel independently from the checkout
        run: |
          set -euo pipefail
          rm -rf dist build parity sdist-extract
          # Explicit targets, because a bare `python -m build` would create the sdist first and then
          # build the wheel from it, leaving no independent original to compare against. No isolation,
          # so the constrained Hatchling installed above is the backend that actually builds.
          python -m build --sdist --wheel --no-isolation
          python -m twine check --strict dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          test -f "dist/metrifid-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/metrifid-${RELEASE_VERSION}.tar.gz"

      - name: Require complete, canonically named, safe wheel contents
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import os
          import pathlib
          import posixpath
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          wheel = pathlib.Path("dist") / f"metrifid-{version}-py3-none-any.whl"
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()
          if len(set(names)) != len(names):
              raise SystemExit("wheel contains duplicate member names")
          normalized: dict[str, str] = {}
          for name in names:
              if "\\" in name:
                  raise SystemExit(f"wheel member uses a backslash path: {name!r}")
              # Every raw name must already be its canonical safe POSIX spelling. A dot alias, a
              # repeated separator or a leading alias is refused even when nothing else collides.
              canonical = posixpath.normpath(name)
              if name != canonical:
                  raise SystemExit(f"wheel member is not canonically named: {name!r} != {canonical!r}")
              member = pathlib.PurePosixPath(name)
              if member.is_absolute() or ".." in member.parts or "." in member.parts:
                  raise SystemExit(f"unsafe wheel member: {name!r}")
              if canonical in normalized:
                  raise SystemExit(f"wheel member normalizes onto {normalized[canonical]!r}: {name!r}")
              normalized[canonical] = name
          if archive.testzip() is not None:
              raise SystemExit(f"wheel CRC failure at {archive.testzip()}")

          distinfo = f"metrifid-{version}.dist-info"
          record_name = f"{distinfo}/RECORD"
          rows = [r for r in csv.reader(archive.read(record_name).decode("utf-8").splitlines()) if r]
          recorded = {row[0] for row in rows}
          if recorded != set(names):
              missing = sorted(set(names) - recorded)
              extra = sorted(recorded - set(names))
              raise SystemExit(f"RECORD does not describe the wheel: missing={missing} extra={extra}")
          if len(recorded) != len(rows):
              raise SystemExit("RECORD contains a duplicate path")
          for path, digest, size in rows:
              if path == record_name:
                  if digest or size:
                      raise SystemExit(f"RECORD self-row must be empty, got {digest!r},{size!r}")
                  continue
              payload = archive.read(path)
              algorithm, _, encoded = digest.partition("=")
              if algorithm != "sha256":
                  raise SystemExit(f"RECORD uses an unexpected hash for {path}: {digest}")
              actual = base64.urlsafe_b64encode(hashlib.sha256(payload).digest()).rstrip(b"=")
              if actual.decode("ascii") != encoded:
                  raise SystemExit(f"RECORD hash mismatch for {path}")
              if int(size) != len(payload):
                  raise SystemExit(f"RECORD size mismatch for {path}")

          metadata = archive.read(f"{distinfo}/METADATA").decode("utf-8")
          if f"Version: {version}" not in metadata.splitlines():
              raise SystemExit("wheel metadata does not report the release version")
          if "License-Expression: Apache-2.0" not in metadata.splitlines():
              raise SystemExit("wheel metadata does not declare Apache-2.0")
          for stem in ("LICENSE", "NOTICE"):
              member_name = f"{distinfo}/licenses/{stem}"
              if member_name not in names:
                  raise SystemExit(f"wheel omits {member_name}")
              if archive.read(member_name) != pathlib.Path(stem).read_bytes():
                  raise SystemExit(f"wheel {stem} does not equal the repository {stem}")
          if "metrifid/py.typed" not in names:
              raise SystemExit("wheel omits the typing marker")
          entry_points = archive.read(f"{distinfo}/entry_points.txt").decode("utf-8")
          if "metrifid = metrifid.cli:main" not in entry_points:
              raise SystemExit("wheel does not declare the console entry point")
          print(f"wheel carries {len(names)} canonically named members")
          PY

      - name: Require wheel package bytes to equal declared source
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          import zipfile

          # The wheel payload is the package tree plus every member the project declares as a
          # force-include. That mapping is read from pyproject.toml and proved, never assumed and
          # never excused: a packaged file that is not declared is drift just as much as a missing one.
          version = os.environ["RELEASE_VERSION"]
          archive = zipfile.ZipFile(pathlib.Path("dist") / f"metrifid-{version}-py3-none-any.whl")
          distinfo = f"metrifid-{version}.dist-info"
          shipped = {
              name: archive.read(name)
              for name in archive.namelist()
              if not name.startswith(f"{distinfo}/")
          }

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          wheel_target = project["tool"]["hatch"]["build"]["targets"]["wheel"]
          packages = wheel_target["packages"]
          if packages != ["src/metrifid"]:
              raise SystemExit(f"unexpected wheel package roots: {packages!r}")
          forced = wheel_target.get("force-include", {})
          if not isinstance(forced, dict):
              raise SystemExit("force-include must be a table of source to destination")

          expected: dict[str, bytes] = {}
          source_root = pathlib.Path("src")
          for path in sorted(source_root.rglob("*")):
              if path.is_file() and "__pycache__" not in path.parts:
                  expected[path.relative_to(source_root).as_posix()] = path.read_bytes()

          seen_destinations: set[str] = set()
          for raw_source, raw_destination in sorted(forced.items()):
              source = pathlib.Path(raw_source)
              destination = pathlib.PurePosixPath(raw_destination)
              if destination.is_absolute() or ".." in destination.parts:
                  raise SystemExit(f"unsafe force-include destination: {raw_destination!r}")
              if source.is_absolute() or ".." in source.parts:
                  raise SystemExit(f"unsafe force-include source: {raw_source!r}")
              if not source.is_file():
                  raise SystemExit(f"declared force-include source is missing: {raw_source!r}")
              key = destination.as_posix()
              if key in seen_destinations or key in expected:
                  raise SystemExit(f"ambiguous force-include destination: {raw_destination!r}")
              seen_destinations.add(key)
              expected[key] = source.read_bytes()

          if shipped != expected:
              only_wheel = sorted(set(shipped) - set(expected))
              only_source = sorted(set(expected) - set(shipped))
              different = sorted(
                  name for name in set(shipped) & set(expected) if shipped[name] != expected[name]
              )
              raise SystemExit(
                  "wheel package bytes do not equal declared source: "
                  f"only_wheel={only_wheel} only_source={only_source} different={different}"
              )
          print(f"wheel payload equals declared source across {len(expected)} members")
          PY

      - name: Validate every sdist member before extracting anything
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tarfile

          version = os.environ["RELEASE_VERSION"]
          sdist = pathlib.Path("dist") / f"metrifid-{version}.tar.gz"
          expected_root = f"metrifid-{version}"
          seen: set[str] = set()
          with tarfile.open(sdist) as archive:
              members = archive.getmembers()
              for member in members:
                  if "\\" in member.name:
                      raise SystemExit(f"sdist member uses a backslash path: {member.name!r}")
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe sdist path: {member.name!r}")
                  if not member.isreg():
                      raise SystemExit(f"unsupported sdist member type: {member.name!r}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"sdist contains a link: {member.name!r}")
                  if member.ischr() or member.isblk() or member.isfifo():
                      raise SystemExit(f"sdist contains a device or FIFO: {member.name!r}")
                  if member.mode & 0o022:
                      raise SystemExit(f"sdist member is group or other writable: {member.name!r}")
                  normalized = os.path.normpath(member.name)
                  if normalized in seen:
                      raise SystemExit(f"duplicate normalized sdist path: {member.name!r}")
                  seen.add(normalized)
                  if path.parts[0] != expected_root:
                      raise SystemExit(f"ambiguous sdist top-level layout: {member.name!r}")
              # Only now that the complete member list has passed is extraction allowed.
              archive.extractall("sdist-extract", filter="data")

          root = pathlib.Path("sdist-extract") / expected_root
          info = (root / "PKG-INFO").read_text(encoding="utf-8").splitlines()
          if f"Version: {version}" not in info:
              raise SystemExit("sdist PKG-INFO does not report the release version")
          if "Metadata-Version: 2.4" not in info:
              raise SystemExit("sdist PKG-INFO does not declare the expected metadata version")
          if "License-Expression: Apache-2.0" not in info:
              raise SystemExit("sdist PKG-INFO does not declare Apache-2.0")
          for stem in ("LICENSE", "NOTICE"):
              if (root / stem).read_bytes() != pathlib.Path(stem).read_bytes():
                  raise SystemExit(f"sdist {stem} does not equal the repository {stem}")
          for path in sorted(pathlib.Path("src").rglob("*")):
              if path.is_file() and "__pycache__" not in path.parts:
                  if (root / path).read_bytes() != path.read_bytes():
                      raise SystemExit(f"sdist source member differs: {path.as_posix()}")
          print(f"validated and extracted {len(members)} sdist members")
          PY

      - name: Build the parity wheel from the validated sdist only
        run: |
          set -euo pipefail
          mkdir -p parity
          python -m build --wheel --no-isolation --outdir parity \
            "sdist-extract/metrifid-${RELEASE_VERSION}"
          # The parity wheel is evidence, never a release artifact. It lives outside dist/ and is
          # renamed so that no wheel glob, upload step, or release step can select it.
          find parity -maxdepth 1 -name '*.whl' -exec mv {} parity/parity-rebuild.notdist \;
          test ! -e "parity/metrifid-${RELEASE_VERSION}-py3-none-any.whl"
          test "$(find parity -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = "0"
          test -f parity/parity-rebuild.notdist

      - name: Require the parity wheel to be equivalent to the independent original
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          original = zipfile.ZipFile(pathlib.Path("dist") / f"metrifid-{version}-py3-none-any.whl")
          parity = zipfile.ZipFile(pathlib.Path("parity") / "parity-rebuild.notdist")
          distinfo = f"metrifid-{version}.dist-info"

          def package_members(archive: zipfile.ZipFile) -> dict[str, bytes]:
              return {
                  name: archive.read(name)
                  for name in archive.namelist()
                  if not name.startswith(f"{distinfo}/")
              }

          if package_members(original) != package_members(parity):
              raise SystemExit("parity wheel package members differ from the original")
          for name in ("entry_points.txt", "METADATA", "licenses/LICENSE", "licenses/NOTICE"):
              if original.read(f"{distinfo}/{name}") != parity.read(f"{distinfo}/{name}"):
                  raise SystemExit(f"parity wheel differs from the original in {name}")
          if "metrifid/py.typed" not in parity.namelist():
              raise SystemExit("parity wheel omits the typing marker")
          PY

      - name: Install the original wheel on the primary runtime and exercise the public surface
        env:
          SUITE_RUNTIME: ${{ runner.temp }}/suite-runtime.json
          JUNIT_REPORT: ${{ runner.temp }}/release-junit.xml
          MJB_LOG: ${{ runner.temp }}/mjb-characterization.log
          DEMO_LOG: ${{ runner.temp }}/demo.log
        run: |
          set -euo pipefail
          RELEASE_VENV="$RUNNER_TEMP/metrifid-release-wheel-venv"
          TEST_CWD="$RUNNER_TEMP/metrifid-release-tests"
          DEMO_CWD="$RUNNER_TEMP/metrifid-demo"
          rm -rf "$RELEASE_VENV" "$TEST_CWD" "$DEMO_CWD"
          python -m venv "$RELEASE_VENV"
          mkdir -p "$TEST_CWD" "$DEMO_CWD"
          # The constraint is applied to the install that resolves NumPy, and the primary release
          # runtime is pinned exactly, so the suite runs on the profile the project declares.
          "$RELEASE_VENV/bin/python" -m pip install \
            -c "$GITHUB_WORKSPACE/.github/quality-constraints.txt" \
            "$GITHUB_WORKSPACE/dist/metrifid-${RELEASE_VERSION}-py3-none-any.whl" \
            "mujoco==${PRIMARY_MUJOCO}"
          # Every top-level import the complete suite performs must be supplied here, including
          # pytest-check, which sixteen current test modules import at module scope.
          "$RELEASE_VENV/bin/python" -m pip install -c "$GITHUB_WORKSPACE/.github/quality-constraints.txt" \
            build editables hatchling hypothesis mypy pytest pytest-check pytest-randomly
          "$RELEASE_VENV/bin/python" -m pip check
          # Runtime identity is read from the interpreter that actually runs the suite.
          "$RELEASE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import os
          import pathlib
          import sys

          import mujoco

          runtime = {
              "python": sys.version.split()[0],
              "pytest": importlib.metadata.version("pytest"),
              "numpy": importlib.metadata.version("numpy"),
              "mujoco": importlib.metadata.version("mujoco"),
              "mujoco_native_string": mujoco.mj_versionString(),
              "mujoco_native_integer": mujoco.mj_version(),
          }
          expected = os.environ["PRIMARY_MUJOCO"]
          if runtime["mujoco"] != expected:
              raise SystemExit(f"suite runtime has MuJoCo {runtime['mujoco']}, not {expected}")
          if runtime["mujoco_native_string"] != expected:
              raise SystemExit(
                  f"native MuJoCo string is {runtime['mujoco_native_string']!r}, not {expected!r}"
              )
          major, minor, patch = (int(part) for part in expected.split("."))
          if runtime["mujoco_native_integer"] != major * 1_000_000 + minor * 1_000 + patch:
              raise SystemExit(f"native MuJoCo integer disagrees: {runtime['mujoco_native_integer']}")
          pathlib.Path(os.environ["SUITE_RUNTIME"]).write_text(
              json.dumps(runtime, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(runtime, sort_keys=True))
          PY
          for surface in "" certify compare audit-timestep review-model qualify-workload \
              review-runtime run-runtime-review; do
            if [ -z "$surface" ]; then
              "$RELEASE_VENV/bin/metrifid" --help > /dev/null
            else
              "$RELEASE_VENV/bin/metrifid" "$surface" --help > /dev/null
            fi
          done
          cd "$TEST_CWD"
          PATH="$RELEASE_VENV/bin:$PATH" PYTHONPATH= \
            "$RELEASE_VENV/bin/python" -m pytest -q --junitxml="$JUNIT_REPORT" \
              "$GITHUB_WORKSPACE/tests"
          PATH="$RELEASE_VENV/bin:$PATH" PYTHONPATH= \
            "$RELEASE_VENV/bin/python" "$GITHUB_WORKSPACE/tools/mjb_characterization.py" > "$MJB_LOG"
          cd "$DEMO_CWD"
          PATH="$RELEASE_VENV/bin:$PATH" PYTHONPATH= \
            "$RELEASE_VENV/bin/python" -m metrifid.demo > "$DEMO_LOG"

      - name: Require the exact accepted skip set and nonempty required outputs
        env:
          JUNIT_REPORT: ${{ runner.temp }}/release-junit.xml
          MJB_LOG: ${{ runner.temp }}/mjb-characterization.log
          DEMO_LOG: ${{ runner.temp }}/demo.log
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          # The observed total is whatever the run reported; a stored total goes stale. The skip set
          # is pinned exactly, because a new, removed or renamed skip changes what the release proved.
          ACCEPTED_SKIPS = {
              "tests.integration.test_mujoco_model_identity_native::test_dependencies_contain_both_hfield_pngs",
              "tests.integration.test_mujoco_model_identity_native::test_mujoco_compiles_official_scene",
              "tests.integration.test_mujoco_model_identity_native::test_source_model_bytes_unchanged",
              "tests.integration.test_mujoco_model_identity_native::test_official_scene_compiles_natively_and_is_admitted",
              "tests.integration.test_mujoco_model_identity_native::test_scene_29dof_remains_admitted_and_unaffected",
              "tests.integration.test_mujoco_model_identity_native::test_unrelated_checkout_xml_does_not_affect_the_dependency_result",
              "tests.integration.test_mujoco_model_identity_native::test_existing_scene_29dof_path_still_works",
              "tests.integration.test_mujoco_model_identity_native::test_every_dependency_is_a_contained_measured_member",
              "tests.integration.test_mujoco_model_identity_native::test_same_role_model_pair_identity_for_scene",
              "tests.integration.test_timestep_audit_native::test_bundled_real_policy_audit_reproduces_after_finalization",
          }

          root = ET.parse(os.environ["JUNIT_REPORT"]).getroot()
          cases = list(root.iter("testcase"))
          if not cases:
              raise SystemExit("the installed-artifact suite reported no test cases")
          failed = [case.attrib for case in cases if case.find("failure") is not None]
          errored = [case.attrib for case in cases if case.find("error") is not None]
          if failed or errored:
              raise SystemExit(f"failures={failed} errors={errored}")

          observed = {
              f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}"
              for case in cases
              if case.find("skipped") is not None
          }
          if observed != ACCEPTED_SKIPS:
              missing = sorted(ACCEPTED_SKIPS - observed)
              unexpected = sorted(observed - ACCEPTED_SKIPS)
              raise SystemExit(f"skip set changed: missing={missing} unexpected={unexpected}")

          for name in ("MJB_LOG", "DEMO_LOG"):
              path = pathlib.Path(os.environ[name])
              if not path.is_file() or not path.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"{name} is missing or empty: {path}")
          print(f"observed {len(cases)} cases with exactly the {len(observed)} accepted skips")
          PY

      - name: Record the public-safe promotion manifest and checksums
        env:
          JUNIT_REPORT: ${{ runner.temp }}/release-junit.xml
          SUITE_RUNTIME: ${{ runner.temp }}/suite-runtime.json
        run: |
          set -euo pipefail
          ( cd dist && sha256sum \
              "metrifid-${RELEASE_VERSION}-py3-none-any.whl" \
              "metrifid-${RELEASE_VERSION}.tar.gz" ) > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = "2"
          RUN_REPOSITORY="$GITHUB_REPOSITORY" RUN_COMMIT="$GITHUB_SHA" RUNNER_LABEL="$RUNNER_OS-$RUNNER_ARCH" \
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET

          # This file travels between jobs in a public repository, so it carries only durable,
          # public-safe release facts. Runtime values come from the interpreter that ran the suite.
          root = ET.parse(os.environ["JUNIT_REPORT"]).getroot()
          cases = list(root.iter("testcase"))
          suite = json.loads(pathlib.Path(os.environ["SUITE_RUNTIME"]).read_text(encoding="utf-8"))
          tree = subprocess.run(
              ["git", "rev-parse", "HEAD^{tree}"], capture_output=True, check=True, text=True
          ).stdout.strip()
          manifest = {
              "schema_version": 4,
              "project": "metrifid",
              "version": os.environ["RELEASE_VERSION"],
              "tag": os.environ["PLANNED_TAG"],
              "mode": os.environ["RELEASE_MODE"],
              "commit": os.environ["RUN_COMMIT"],
              "tree": tree,
              "repository": os.environ["RUN_REPOSITORY"],
              "workflow_sha256": hashlib.sha256(
                  pathlib.Path(".github/workflows/publish.yml").read_bytes()
              ).hexdigest(),
              "build": {
                  "backend": "hatchling",
                  "backend_version": importlib.metadata.version("hatchling"),
                  "frontend_version": importlib.metadata.version("build"),
                  "twine_version": importlib.metadata.version("twine"),
                  "isolated": False,
                  "runner": os.environ["RUNNER_LABEL"],
              },
              "suite_runtime": {
                  "python": suite["python"],
                  "pytest": suite["pytest"],
                  "numpy": suite["numpy"],
                  "mujoco": suite["mujoco"],
                  "mujoco_native_string": suite["mujoco_native_string"],
                  "mujoco_native_integer": suite["mujoco_native_integer"],
              },
              "artifacts": [
                  {
                      "filename": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in sorted(pathlib.Path("dist").iterdir())
                  if path.is_file()
              ],
              "outcomes": {
                  "observed_test_cases": len(cases),
                  "pip_check": "passed",
                  "help_surfaces": "passed",
                  "demo": "passed",
                  "mjb_characterization": "passed",
              },
          }
          pathlib.Path("dist-promotion-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          sed -n "/^## ${RELEASE_VERSION}\$/,/^## /p" CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            dist/
            SHA256SUMS.txt
            RELEASE_NOTES.md
            dist-promotion-manifest.json
          if-no-files-found: error
          retention-days: 1

  testpypi_publish:
    name: publish to TestPyPI
    needs: build_and_validate
    if: ${{ inputs.mode == 'staged-release' }}
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/metrifid
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-artifacts

      - name: Decide the remote registry state
        id: remote_state
        env:
          INDEX_JSON_URL: https://test.pypi.org/pypi/metrifid/${{ inputs.release_version }}/json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.request

          def exact_rows(payload, expected_names):
              """Validate the index file list before any mapping collapses a duplicate row."""
              if not isinstance(payload, dict):
                  raise SystemExit("index response is not an object")
              rows = payload.get("urls")
              if not isinstance(rows, list):
                  raise SystemExit("index response has no file list")
              seen = {}
              for row in rows:
                  if not isinstance(row, dict):
                      raise SystemExit("index row is not an object")
                  name = row.get("filename")
                  if not isinstance(name, str) or name not in expected_names:
                      raise SystemExit(f"index row has an unexpected filename: {name!r}")
                  if name in seen:
                      raise SystemExit(f"index lists {name!r} more than once")
                  digests = row.get("digests")
                  if not isinstance(digests, dict):
                      raise SystemExit(f"index row for {name!r} carries no digests")
                  digest = digests.get("sha256")
                  if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
                      raise SystemExit(f"index row for {name!r} has a malformed digest")
                  url = row.get("url")
                  if not isinstance(url, str) or not url.startswith("https://"):
                      raise SystemExit(f"index row for {name!r} has no https url")
                  seen[name] = digest
              return seen

          # Only three states are valid: an explicit not-found permits one upload, exact equality is
          # idempotent success, and anything else stops without uploading. No other failure is
          # converted into absence.
          root = pathlib.Path("release-artifacts")
          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          expected = {row["filename"]: row["sha256"] for row in manifest["artifacts"]}
          try:
              with urllib.request.urlopen(os.environ["INDEX_JSON_URL"], timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"index lookup failed with HTTP {error.code}")
              upload = True
          else:
              observed = exact_rows(payload, set(expected))
              if observed != expected:
                  raise SystemExit(
                      f"the index already holds a different or incomplete state: {observed!r}"
                  )
              upload = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"upload={'true' if upload else 'false'}\n")
          print("upload" if upload else "already present with identical hashes")
          PY

      - name: Require public identity after approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GH_REPO}" --jq '.default_branch')"
          test -n "$default_branch"
          PUBLIC_MAIN_HEAD="$(gh api "repos/${GH_REPO}/commits/${default_branch}" --jq '.sha')"
          REMOTE_TREE="$(gh api "repos/${GH_REPO}/commits/${EXPECTED_COMMIT}" --jq '.commit.tree.sha')"
          REMOTE_WORKFLOW_B64="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.content')"
          REMOTE_WORKFLOW_ENCODING="$(gh api "repos/${GH_REPO}/contents/.github/workflows/publish.yml?ref=${EXPECTED_COMMIT}" --jq '.encoding')"
          TAG_OBJECT_TYPE="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.type')"
          TAG_OBJECT_SHA="$(gh api "repos/${GH_REPO}/git/ref/tags/${PLANNED_TAG}" --jq '.object.sha')"
          if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
            TAG_PEELED="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
            TAG_PEELED_TYPE="$(gh api "repos/${GH_REPO}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.type')"
          else
            TAG_PEELED=""
            TAG_PEELED_TYPE=""
          fi
          export PUBLIC_MAIN_HEAD REMOTE_TREE REMOTE_WORKFLOW_B64 REMOTE_WORKFLOW_ENCODING
          export TAG_OBJECT_TYPE TAG_PEELED TAG_PEELED_TYPE
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import pathlib
          import re

          # This is the last run step before the mutation, after the environment approval, so the
          # owner may advance public main and create the annotated tag while the run waits here.
          # Every value is compared against the public repository, never against another field of
          # the same manifest.
          root = pathlib.Path("release-artifacts")
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["PLANNED_TAG"]
          expected = os.environ["EXPECTED_COMMIT"]
          observed = os.environ["GITHUB_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit(f"expected commit is not a full commit id: {expected!r}")
          if expected != observed:
              raise SystemExit(f"expected commit {expected!r} is not the run commit {observed!r}")

          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          for field, value in (
              ("commit", observed),
              ("version", version),
              ("tag", tag),
              ("repository", os.environ["GITHUB_REPOSITORY"]),
          ):
              if manifest.get(field) != value:
                  raise SystemExit(f"manifest {field} is {manifest.get(field)!r}, not {value!r}")

          remote_tree = os.environ["REMOTE_TREE"]
          if not re.fullmatch(r"[0-9a-f]{40}", remote_tree):
              raise SystemExit(f"the public commit tree is not an object id: {remote_tree!r}")
          if manifest.get("tree") != remote_tree:
              raise SystemExit(
                  f"manifest tree {manifest.get('tree')!r} is not the public tree {remote_tree!r}"
              )
          if os.environ["REMOTE_WORKFLOW_ENCODING"] != "base64":
              raise SystemExit(
                  "the public workflow content is not base64: "
                  f"{os.environ['REMOTE_WORKFLOW_ENCODING']!r}"
              )
          # GitHub documents line separators inside its Base64 content. Only those are removed,
          # and decoding is strict, so trailing garbage or bad padding cannot slip through.
          encoded = os.environ["REMOTE_WORKFLOW_B64"].replace("\n", "")
          if not encoded:
              raise SystemExit("the public workflow content is empty")
          try:
              workflow_bytes = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"the public workflow content is not decodable: {error}") from error
          if not workflow_bytes:
              raise SystemExit("the public workflow content is empty")
          remote_workflow = hashlib.sha256(workflow_bytes).hexdigest()
          if manifest.get("workflow_sha256") != remote_workflow:
              raise SystemExit(
                  f"manifest workflow digest {manifest.get('workflow_sha256')!r} is not the public "
                  f"workflow digest {remote_workflow!r}"
              )

          if os.environ["PUBLIC_MAIN_HEAD"] != observed:
              raise SystemExit(
                  f"public default branch head {os.environ['PUBLIC_MAIN_HEAD']!r} is not {observed!r}"
              )
          if os.environ["TAG_OBJECT_TYPE"] != "tag":
              raise SystemExit(
                  f"tag {tag!r} is not an annotated tag object: {os.environ['TAG_OBJECT_TYPE']!r}"
              )
          if os.environ["TAG_PEELED_TYPE"] != "commit":
              raise SystemExit(f"tag {tag!r} does not peel to a commit object")
          if os.environ["TAG_PEELED"] != observed:
              raise SystemExit(
                  f"annotated tag peels to {os.environ['TAG_PEELED']!r}, not {observed!r}"
              )

          expected_names = {
              f"metrifid-{version}-py3-none-any.whl",
              f"metrifid-{version}.tar.gz",
          }
          stored = {row["filename"]: row for row in manifest["artifacts"]}
          if set(stored) != expected_names:
              raise SystemExit(f"manifest does not describe the release pair: {sorted(stored)}")
          present = sorted(path.name for path in (root / "dist").iterdir() if path.is_file())
          if present != sorted(expected_names):
              raise SystemExit(f"distribution directory is not exactly the pair: {present}")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          if len(lines) != 2:
              raise SystemExit(f"SHA256SUMS.txt must hold exactly two lines, got {len(lines)}")
          checksums = {}
          for line in lines:
              digest, _, name = line.partition("  ")
              checksums[name] = digest
          for name, row in stored.items():
              blob = (root / "dist" / name).read_bytes()
              if hashlib.sha256(blob).hexdigest() != row["sha256"]:
                  raise SystemExit(f"{name} does not match the stored hash")
              if len(blob) != row["size"]:
                  raise SystemExit(f"{name} does not match the stored size")
              if checksums.get(name) != row["sha256"]:
                  raise SystemExit(f"SHA256SUMS.txt does not describe {name}")
          print("public identity and stored bytes agree")
          PY

      - name: Publish to TestPyPI
        if: ${{ steps.remote_state.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-artifacts/dist/
          repository-url: https://test.pypi.org/legacy/

  testpypi_verify:
    name: verify TestPyPI publication
    needs: testpypi_publish
    if: ${{ inputs.mode == 'staged-release' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-artifacts

      - name: Poll the index and download both files
        env:
          INDEX_JSON_URL: https://test.pypi.org/pypi/metrifid/${{ inputs.release_version }}/json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          def exact_rows(payload, expected_names):
              """Validate the index file list before any mapping collapses a duplicate row."""
              if not isinstance(payload, dict):
                  raise SystemExit("index response is not an object")
              rows = payload.get("urls")
              if not isinstance(rows, list):
                  raise SystemExit("index response has no file list")
              seen = {}
              for row in rows:
                  if not isinstance(row, dict):
                      raise SystemExit("index row is not an object")
                  name = row.get("filename")
                  if not isinstance(name, str) or name not in expected_names:
                      raise SystemExit(f"index row has an unexpected filename: {name!r}")
                  if name in seen:
                      raise SystemExit(f"index lists {name!r} more than once")
                  digests = row.get("digests")
                  if not isinstance(digests, dict):
                      raise SystemExit(f"index row for {name!r} carries no digests")
                  digest = digests.get("sha256")
                  if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
                      raise SystemExit(f"index row for {name!r} has a malformed digest")
                  url = row.get("url")
                  if not isinstance(url, str) or not url.startswith("https://"):
                      raise SystemExit(f"index row for {name!r} has no https url")
                  seen[name] = digest
              return seen

          # Index propagation is ordinary, so poll for a bounded period rather than failing on the
          # first miss. Only an explicit not-found is a reason to keep waiting; every other failure
          # is reported immediately, so a rerun is safe and a real fault is never hidden.
          root = pathlib.Path("release-artifacts")
          manifest = json.loads((root / "dist-promotion-manifest.json").read_text(encoding="utf-8"))
          expected = {row["filename"]: row["sha256"] for row in manifest["artifacts"]}
          deadline = time.monotonic() + 300
          last = "no response yet"
          payload: dict[str, object] = {}
          while True:
              try:
                  with urllib.request.urlopen(os.environ["INDEX_JSON_URL"], timeout=30) as response:
                      payload = json.load(response)
                  # A malformed, extra or duplicated row is immutable and unsafe, so exact_rows
                  # raises rather than letting the deadline expire on a state that cannot heal.
                  observed = exact_rows(payload, set(expected))
                  if observed == expected:
                      break
                  wrong = sorted(n for n, d in observed.items() if expected[n] != d)
                  if wrong:
                      raise SystemExit(f"the index holds a different digest for {wrong}")
                  # Only a correct subset of the expected pair is ordinary propagation.
                  last = f"index is still missing {sorted(set(expected) - set(observed))}"
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f"index lookup failed with HTTP {error.code}")
                  last = "index reports 404"
              if time.monotonic() >= deadline:
                  raise SystemExit(f"timed out waiting for the index; last observed: {last}")
              time.sleep(15)

          target = pathlib.Path("downloaded")
          target.mkdir(exist_ok=True)
          for row in payload["urls"]:
              with urllib.request.urlopen(row["url"], timeout=60) as response:
                  body = response.read()
              if hashlib.sha256(body).hexdigest() != expected[row["filename"]]:
                  raise SystemExit(f"downloaded {row['filename']} does not match the original")
              if body != (root / "dist" / row["filename"]).read_bytes():
                  raise SystemExit(f"downloaded {row['filename']} is not byte-identical")
              (target / row["filename"]).write_bytes(body)
          print("both remote files are byte-identical to the originals")
          PY

      - name: Install the downloaded wheel and run the public journeys
        run: |
          set -euo pipefail
          STAGE_VENV="$RUNNER_TEMP/metrifid-testpypi-venv"
          rm -rf "$STAGE_VENV"
          python -m venv "$STAGE_VENV"
          "$STAGE_VENV/bin/python" -m pip install \
            "downloaded/metrifid-${RELEASE_VERSION}-py3-none-any.whl"
          "$STAGE_VENV/bin/python" -m pip check
          test "$("$STAGE_VENV/bin/python" -c 'import metrifid; print(metrifid.__version__)')" \
            = "${RELEASE_VERSION}"
          for surface in "" certify compare audit-timestep review-model qualify-workload \
              review-runtime run-runtime-review; do
            if [ -z "$surface" ]; then
              "$STAGE_VENV/bin/metrifid" --help > /dev/null
            else
              "$STAGE_VENV/bin/metrifid" "$surface" --help > /dev/null
            fi
          done
          JOURNEY="$RUNNER_TEMP/metrifid-testpypi-journey"
          rm -rf "$JOURNEY"; mkdir -p "$JOURNEY"
          cd "$JOURNEY"
          PATH="$STAGE_VENV/bin:$PATH" PYTHONPATH= "$STAGE_VENV/bin/python" -m metrifid.demo > /dev/null
          PATH="$STAGE_VENV/bin:$PATH" PYTHONPATH= "$STAGE_VENV/bin/python" - <<'PY'
          import pathlib
          import subprocess

          # One deterministic product journey through the installed console script: two source
          # spellings that compile to one artifact must certify, and the receipt must be published.
          baseline = pathlib.Path("baseline.xml")
          candidate = pathlib.Path("candidate.xml")
          baseline.write_text(
              '<mujoco model="journey">\n'
              "  <worldbody>\n"
              '    <body name="arm" pos="0 0 1">\n'
              '      <geom name="link" type="capsule" size="0.04 0.2" mass="1.5"/>\n'
              '      <joint name="shoulder" type="hinge" axis="0 1 0"/>\n'
              "    </body>\n"
              "  </worldbody>\n"
              "</mujoco>\n",
              encoding="utf-8",
          )
          candidate.write_text(
              '<mujoco model="journey">\n'
              "  <worldbody>\n"
              '    <body pos="0 0 1" name="arm">\n'
              '      <geom mass="1.5" name="link" size="0.04 0.2" type="capsule"/>\n'
              '      <joint axis="0 1 0" name="shoulder" type="hinge"/>\n'
              "    </body>\n"
              "  </worldbody>\n"
              "</mujoco>\n",
              encoding="utf-8",
          )
          done = subprocess.run(
              ["metrifid", "certify", str(baseline), str(candidate), "--output", "receipt"],
              capture_output=True,
              text=True,
          )
          if done.returncode != 0:
              raise SystemExit(f"certify journey exited {done.returncode}: {done.stderr}")
          published = sorted(path.name for path in pathlib.Path("receipt").rglob("*") if path.is_file())
          if not published:
              raise SystemExit("certify journey published no receipt")
          print(f"certify journey published {len(published)} receipt files")
          PY

