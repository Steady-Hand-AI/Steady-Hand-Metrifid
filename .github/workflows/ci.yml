          }
          pathlib.Path("diagnostic-evidence/runtime_identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identity, sort_keys=True))
          PY

      - name: Complete installed-wheel test suite
        run: >-
          python -m pytest -q -n auto --dist loadfile --randomly-seed=17
          --junitxml=diagnostic-evidence/full.xml tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # The `diagnostic-` prefix is what the summary uses to ignore this evidence.
          name: diagnostic-${{ matrix.id }}
          path: diagnostic-evidence/
