          - id: linux_x64_py313
            runner: ubuntu-24.04
            python: "3.13"
          - id: linux_x64_py314
            runner: ubuntu-24.04
            python: "3.14"
          - id: macos_arm64_py311
            runner: macos-15
            python: "3.11"
          - id: macos_arm64_py312
            runner: macos-15
            python: "3.12"
          - id: macos_arm64_py313
            runner: macos-15
            python: "3.13"
          - id: macos_arm64_py314
            runner: macos-15
            python: "3.14"
          - id: macos_x64_py311
            runner: macos-15-intel
