          wheels = sorted(pathlib.Path("release-artifacts/dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          expected = pathlib.Path("release-artifacts/wheel.sha256").read_text(encoding="utf-8").strip()
          actual = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          PY
          python -m pip install "$(ls release-artifacts/dist/*.whl)"
          python -m pip install -c .github/quality-constraints.txt \
            editables hatchling hypothesis mypy pytest pytest-randomly

      - name: Lane runtime identity
        run: python -m pip check

      - name: Installed-wheel test suite
        run: python -m pytest -q tests

      - name: Bundled first-use example
        run: python examples/certify/run_example.py

      - name: CLI help smoke
        run: |
          metrifid --help
