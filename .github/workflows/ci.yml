      - name: Record the diagnostic runtime identity
        run: |
          python -m pip check
          mkdir -p diagnostic-evidence
          python - <<'PY'
          import json
          import pathlib
          import platform
          import sys

          import mujoco
          import numpy

          from metrifid._mujoco_runtime import admit_mujoco_runtime

          # The same structural fields every required lane records. This job is nonblocking and
          # stays outside the summary decision, but a document missing half its fields could not be
          # compared with a required lane if a portability question ever needed answering, which is
          # the entire reason the job exists.
          admission = admit_mujoco_runtime()
          identity = {
              "package_version": mujoco.__version__,
              "package_base_version": admission.package_base_version,
