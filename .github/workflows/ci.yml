    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.ORIGINAL_ARTIFACT }}
          path: release-artifacts

      - name: Verify and install the exact original wheel
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          manifest = json.loads(
              pathlib.Path("release-artifacts/original_manifest.json").read_text(encoding="utf-8")
          )
          wheels = sorted(pathlib.Path("release-artifacts/dist").glob("*.whl"))
