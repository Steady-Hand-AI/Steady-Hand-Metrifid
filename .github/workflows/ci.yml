name: ci

# Build one wheel once. Every blocking compatibility lane installs those exact bytes noneditably.
# MJB digests are lane-local evidence and are never compared across runtimes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WHEEL_ARTIFACT: metrifid-distributions

jobs:
  build_and_quality:
    name: build and quality (linux, python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install the deterministic build and quality toolchain
        run: |
          python -m pip install -c .github/quality-constraints.txt \
            build editables hatchling hypothesis mypy numpy pytest pytest-randomly ruff twine \
            "mujoco==3.10.0.*"
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: MyPy strict
        run: python -m mypy --strict src/metrifid

      - name: Build one direct wheel and one direct sdist through isolated PEP 517
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Record the wheel identity
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          pathlib.Path("wheel.sha256").write_text(digest + "\n", encoding="utf-8")
          print("wheel", wheels[0].name, digest)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: |
            dist/
            wheel.sha256
          if-no-files-found: error

  matrix_lane:
    name: ${{ matrix.id }}
    needs: build_and_quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux_x64_py311
            runner: ubuntu-24.04
            python: "3.11"
          - id: linux_x64_py312
            runner: ubuntu-24.04
            python: "3.12"
          - id: linux_x64_py313
            runner: ubuntu-24.04
            python: "3.13"
          - id: linux_x64_py314
            runner: ubuntu-24.04
            python: "3.14"
          - id: macos_arm64_py311
            runner: macos-15
            python: "3.11"
          - id: macos_arm64_py312
            runner: macos-15
            python: "3.12"
          - id: macos_arm64_py313
            runner: macos-15
            python: "3.13"
          - id: macos_arm64_py314
            runner: macos-15
            python: "3.14"
          - id: macos_x64_py311
            runner: macos-15-intel
            python: "3.11"
          - id: macos_x64_py312
            runner: macos-15-intel
            python: "3.12"
          - id: macos_x64_py313
            runner: macos-15-intel
            python: "3.13"
          - id: macos_x64_py314
            runner: macos-15-intel
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: release-artifacts

      - name: Verify and install the exact built wheel with the normal resolver
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          wheels = sorted(pathlib.Path("release-artifacts/dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          expected = pathlib.Path("release-artifacts/wheel.sha256").read_text(encoding="utf-8").strip()
          actual = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          PY
          python -m pip install "$(ls release-artifacts/dist/*.whl)"
          python -m pip install -c .github/quality-constraints.txt \
            editables hatchling hypothesis mypy pytest pytest-randomly

      - name: Lane runtime identity
        run: python -m pip check

      - name: Create lane evidence directory
        run: mkdir -p lane-evidence

      - name: Installed-wheel test suite
        run: python -m pytest -q --junitxml=lane-evidence/full.xml tests

      - name: Fixed randomized installed-wheel suite
        if: matrix.id == 'linux_x64_py312'
        run: python -m pytest -q --randomly-seed=17 --junitxml=lane-evidence/randomized.xml tests

      - name: Bundled first-use example
        run: |
          python examples/certify/run_example.py > lane-evidence/example.log
          cat lane-evidence/example.log

      - name: Gymnasium workload helper end-to-end
        run: |
          python -m pip install gymnasium
          mkdir -p lane-evidence/workload
          python examples/workload/record_gymnasium_workload.py --env HalfCheetah-v5 --output lane-evidence/workload --steps 5
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          
          state = np.load("lane-evidence/workload/state.npz")
          actions = np.load("lane-evidence/workload/actions.npz")
          
          assert "qpos_offsets" in state
          assert "qvel_offsets" in state
          assert "actuator_names" in actions
          assert "values" in actions
          print("Workload helper executed and artifacts loaded successfully!")
          PY

      - name: CLI help smoke
        run: |
          {
            metrifid --help
            metrifid certify --help
            metrifid compare --help
            metrifid audit-timestep --help
          } > lane-evidence/cli_help.log
          cat lane-evidence/cli_help.log

      - name: Wheel-only demo from an empty directory
        run: |
          mkdir -p "$RUNNER_TEMP/demo-empty"
          cd "$RUNNER_TEMP/demo-empty"
          python -m metrifid.demo | tee "$GITHUB_WORKSPACE/lane-evidence/demo.log"

      - name: SDK examples from a copied directory
        run: |
          rm -rf "$RUNNER_TEMP/sdk-copy" && mkdir -p "$RUNNER_TEMP/sdk-copy"
          cp examples/sdk/*.py "$RUNNER_TEMP/sdk-copy/"
          cd "$RUNNER_TEMP/sdk-copy"
          for script in certify_api.py compare_api.py audit_api.py; do
            python "$script"
          done | tee "$GITHUB_WORKSPACE/lane-evidence/sdk_examples.log"

      - name: Source-checkout comparison example
        run: |
          rm -rf "$RUNNER_TEMP/compare-copy" && mkdir -p "$RUNNER_TEMP/compare-copy"
          cp -R examples/compare/. "$RUNNER_TEMP/compare-copy/"
          cd "$RUNNER_TEMP/compare-copy"
          python prepare_workload.py
          metrifid compare comparison.json | tee "$GITHUB_WORKSPACE/lane-evidence/compare_example.log"

      - name: MJB characterization (29 checks, lane-local)
        run: |
          python tools/mjb_characterization.py > lane-evidence/mjb.log
          cat lane-evidence/mjb.log

      - name: Record blocking lane evidence
        run: |
          cp release-artifacts/wheel.sha256 lane-evidence/wheel.sha256
          printf '%s\n' '${{ matrix.id }}' > lane-evidence/lane_id.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lane-${{ matrix.id }}
          path: lane-evidence/
          if-no-files-found: error

