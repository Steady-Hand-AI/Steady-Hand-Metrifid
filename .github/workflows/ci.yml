          metrifid compare --help
          metrifid audit-timestep --help

      - name: Wheel-only demo from an empty directory
        run: |
          mkdir -p "$RUNNER_TEMP/demo-empty"
          cd "$RUNNER_TEMP/demo-empty"
          python -m metrifid.demo | tee "$GITHUB_WORKSPACE/lane-evidence/demo.log"

      - name: SDK examples from a copied directory
        run: |
          rm -rf "$RUNNER_TEMP/sdk-copy" && mkdir -p "$RUNNER_TEMP/sdk-copy"
          cp examples/sdk/*.py "$RUNNER_TEMP/sdk-copy/"
          cd "$RUNNER_TEMP/sdk-copy"
          for script in certify_api.py compare_api.py audit_api.py; do
            python "$script"
          done | tee "$GITHUB_WORKSPACE/lane-evidence/sdk_examples.log"

      - name: Source-checkout comparison example
        run: |
          rm -rf "$RUNNER_TEMP/compare-copy" && mkdir -p "$RUNNER_TEMP/compare-copy"
          cp -R examples/compare/. "$RUNNER_TEMP/compare-copy/"
          cd "$RUNNER_TEMP/compare-copy"
          python prepare_workload.py
          metrifid compare comparison.json | tee "$GITHUB_WORKSPACE/lane-evidence/compare_example.log"

      - name: MJB characterization (29 checks, lane-local)
        run: python tools/mjb_characterization.py

  test_composite_action:
    name: test the composite action integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create real Metrifid fixtures
        run: |
          mkdir -p fixtures/baseline fixtures/candidate
          cat << 'EOF' > fixtures/baseline/model.xml
          <mujoco>
            <worldbody>
              <geom size="1" type="sphere"/>
            </worldbody>
          </mujoco>
          EOF
          cp fixtures/baseline/model.xml fixtures/candidate/model.xml
          cat << 'EOF' > fixtures/candidate/changed.xml
          <mujoco>
            <worldbody>
              <geom size="2" type="sphere"/>
            </worldbody>
          </mujoco>
          EOF
          
          # For testing adversarial inputs
          mkdir -p 'fixtures/adverse/; $(echo injected);/dir'
          cp fixtures/baseline/model.xml 'fixtures/adverse/; $(echo injected);/dir/model.xml'

          # For testing leading dash inputs
          cp fixtures/baseline/model.xml "-model.xml"

      - name: Test valid model equivalence (Exit 0)
        id: test_0
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/model.xml
          python_version: "3.11"
          
      - name: Verify Exit 0 Outputs
        run: |
          if [ "${{ steps.test_0.outputs.exit_code }}" != "0" ]; then exit 1; fi
          if [ "${{ steps.test_0.outputs.status }}" != "certified_compiled_equivalence" ]; then exit 1; fi

      - name: Test physical difference (Exit 40)
        id: test_40
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/changed.xml
          python_version: "3.11"

      - name: Verify Exit 40 Outputs
        run: |
          if [ "${{ steps.test_40.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_40.outputs.exit_code }}" != "40" ]; then exit 1; fi
          if [ "${{ steps.test_40.outputs.status }}" != "not_certified_compiled_differs" ]; then exit 1; fi

      - name: Test adversarial path inputs
        id: test_adverse
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: 'fixtures/adverse/; $(echo injected);/dir/model.xml'
          python_version: "3.11"
          
      - name: Verify adversarial outputs
        run: |
          if [ "${{ steps.test_adverse.outputs.exit_code }}" != "0" ]; then exit 1; fi

      - name: Test leading dash paths
        id: test_dash
        uses: ./
        with:
          baseline_mjcf: "-model.xml"
          candidate_mjcf: "-model.xml"
          python_version: "3.11"

      - name: Verify leading dash outputs
        run: |
          if [ "${{ steps.test_dash.outputs.exit_code }}" != "0" ]; then exit 1; fi

      - name: Inject Stub for 64 and 70
        run: |
          cat << 'EOF' > /tmp/metrifid_stub.sh
          metrifid() {
            if [[ "$*" == *stub_64* ]]; then return 64; fi
            if [[ "$*" == *stub_70* ]]; then return 70; fi
            command metrifid "$@"
          }
          export -f metrifid
          EOF
          echo "BASH_ENV=/tmp/metrifid_stub.sh" >> $GITHUB_ENV

      - name: Test stub 64
        id: test_64
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: stub_64
          candidate_mjcf: stub_64
          python_version: "3.11"

      - name: Verify stub 64
        run: |
          if [ "${{ steps.test_64.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_64.outputs.exit_code }}" != "64" ]; then exit 1; fi
          if [ "${{ steps.test_64.outputs.status }}" != "refused" ]; then exit 1; fi

      - name: Test stub 70
        id: test_70
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: stub_70
          candidate_mjcf: stub_70
          python_version: "3.11"

      - name: Verify stub 70
        run: |
          if [ "${{ steps.test_70.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_70.outputs.exit_code }}" != "70" ]; then exit 1; fi
          if [ "${{ steps.test_70.outputs.status }}" != "operational_error" ]; then exit 1; fi

      - name: Delete git directory to simulate remote unpacked action
        run: rm -rf .git

      - name: Test remote action identity
        id: test_remote
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/model.xml
          python_version: "3.11"

      - name: Verify remote outputs
        run: |
          if [ "${{ steps.test_remote.outputs.exit_code }}" != "0" ]; then exit 1; fi
