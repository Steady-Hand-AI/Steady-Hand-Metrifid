  test_composite_action:
    name: test the composite action integration
    # `action.yml` is a separately shipped entry surface, so it keeps its own integration test. The
    # wheel this job builds for itself is action evidence only and is never uploaded as a lane
    # artifact or compared with the original publication candidate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create real Metrifid fixtures
        run: |
          mkdir -p fixtures/baseline fixtures/candidate
          cat << 'EOF' > fixtures/baseline/model.xml
          <mujoco>
            <worldbody>
              <geom size="1" type="sphere"/>
            </worldbody>
          </mujoco>
          EOF
          cp fixtures/baseline/model.xml fixtures/candidate/model.xml
          cat << 'EOF' > fixtures/candidate/changed.xml
          <mujoco>
            <worldbody>
              <geom size="2" type="sphere"/>
            </worldbody>
          </mujoco>
          EOF

          # For testing adversarial inputs
          mkdir -p 'fixtures/adverse/; $(echo injected);/dir'
          cp fixtures/baseline/model.xml 'fixtures/adverse/; $(echo injected);/dir/model.xml'

          # For testing leading dash inputs
          cp fixtures/baseline/model.xml ./-model.xml

      - name: Test valid model equivalence (Exit 0)
        id: test_0
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/model.xml
          python_version: "3.11"

      - name: Verify Exit 0 Outputs
        run: |
          if [ "${{ steps.test_0.outputs.exit_code }}" != "0" ]; then exit 1; fi
          if [ "${{ steps.test_0.outputs.status }}" != "certified_compiled_equivalence" ]; then exit 1; fi

      - name: Test physical difference (Exit 40)
        id: test_40
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/changed.xml
          python_version: "3.11"

      - name: Verify Exit 40 Outputs
        run: |
          if [ "${{ steps.test_40.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_40.outputs.exit_code }}" != "40" ]; then exit 1; fi
          if [ "${{ steps.test_40.outputs.status }}" != "not_certified_compiled_differs" ]; then exit 1; fi

      - name: Test adversarial path inputs
        id: test_adverse
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: 'fixtures/adverse/; $(echo injected);/dir/model.xml'
          python_version: "3.11"

      - name: Verify adversarial outputs
        run: |
          if [ "${{ steps.test_adverse.outputs.exit_code }}" != "0" ]; then exit 1; fi

      - name: Test leading dash paths
        id: test_dash
        uses: ./
        with:
          baseline_mjcf: "-model.xml"
          candidate_mjcf: "-model.xml"
          python_version: "3.11"

      - name: Verify leading dash outputs
        run: |
          if [ "${{ steps.test_dash.outputs.exit_code }}" != "0" ]; then exit 1; fi

      - name: Inject Stub for 64 and 70
        run: |
          cat << 'EOF' > /tmp/metrifid_stub.sh
          metrifid() {
            if [[ "$*" == *stub_64* ]]; then return 64; fi
            if [[ "$*" == *stub_70* ]]; then return 70; fi
            command metrifid "$@"
          }
          export -f metrifid
          EOF
          echo "BASH_ENV=/tmp/metrifid_stub.sh" >> $GITHUB_ENV

      - name: Test stub 64
        id: test_64
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: stub_64
          candidate_mjcf: stub_64
          python_version: "3.11"

      - name: Verify stub 64
        run: |
          if [ "${{ steps.test_64.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_64.outputs.exit_code }}" != "64" ]; then exit 1; fi
          if [ "${{ steps.test_64.outputs.status }}" != "refused" ]; then exit 1; fi

      - name: Test stub 70
        id: test_70
        uses: ./
        continue-on-error: true
        with:
          baseline_mjcf: stub_70
          candidate_mjcf: stub_70
          python_version: "3.11"

      - name: Verify stub 70
        run: |
          if [ "${{ steps.test_70.outcome }}" != "failure" ]; then exit 1; fi
          if [ "${{ steps.test_70.outputs.exit_code }}" != "70" ]; then exit 1; fi
          if [ "${{ steps.test_70.outputs.status }}" != "operational_error" ]; then exit 1; fi

      - name: Delete git directory to simulate remote unpacked action
        run: rm -rf .git

      - name: Test remote action identity
        id: test_remote
        uses: ./
        with:
          baseline_mjcf: fixtures/baseline/model.xml
          candidate_mjcf: fixtures/candidate/model.xml
          python_version: "3.11"

      - name: Verify remote outputs
        run: |
          if [ "${{ steps.test_remote.outputs.exit_code }}" != "0" ]; then exit 1; fi

  release_matrix_summary:
    name: release compatibility summary
    # Exactly `always()`, with no event condition. A conditionally skipped job is reported to
    # branch protection as a successful status, so a required check must never be skippable. Any
    # extra condition here would reintroduce that false green.
    if: always()
    needs:
      - build_and_quality
      - matrix_lane
      - minimum_dependency_lane
      - retained_compatibility_lane
      - sdist_install_lane
      - distribution_equivalence
      - test_composite_action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: needs.build_and_quality.result == 'success'
        with:
          name: ${{ env.ORIGINAL_ARTIFACT }}
          path: evidence/original-artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: lane-*
          path: evidence
          merge-multiple: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: retained-*
          path: evidence
          merge-multiple: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: sdist-install-evidence
          path: evidence/sdist-install-evidence

      # Downloaded on purpose. The helper must be able to see diagnostic evidence and ignore it,
      # which is a stronger guarantee than never letting it near the decision.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: diagnostic-*
          path: evidence
          merge-multiple: false

      - name: Decide release evidence
        # The only decision authority. It reads the upstream results and the downloaded evidence
        # and exits nonzero on any violation; there is no shell fallback that could soften that.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPSTREAM_RESULTS: >-
            {"build_and_quality": "${{ needs.build_and_quality.result }}",
             "matrix_lane": "${{ needs.matrix_lane.result }}",
             "minimum_dependency_lane": "${{ needs.minimum_dependency_lane.result }}",
             "retained_compatibility_lane": "${{ needs.retained_compatibility_lane.result }}",
             "sdist_install_lane": "${{ needs.sdist_install_lane.result }}",
             "distribution_equivalence": "${{ needs.distribution_equivalence.result }}",
             "test_composite_action": "${{ needs.test_composite_action.result }}"}
        run: |
          python .github/scripts/validate_ci_evidence.py \
            --evidence-root evidence \
            --upstream-results "$UPSTREAM_RESULTS" \
            --event-name "$EVENT_NAME" \
            --event-sha "$EVENT_SHA" \
            --pull-request-head-sha "$PR_HEAD_SHA"
