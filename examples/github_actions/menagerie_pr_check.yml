name: "MuJoCo Menagerie Certification"

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.xml'

jobs:
  certify-model:
    name: "Certify Model Artifacts"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Example matrix testing different models in the repository
        model:
          - robotiq_2f85
          - shadow_hand
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Metrifid Certify
        uses: Steady-Hand-AI/Steady-Hand-Metrifid@v0.2.1
        with:
          # Assuming the repository has directories for each model
          baseline_mjcf: baseline/${{ matrix.model }}/scene.xml
          candidate_mjcf: candidate/${{ matrix.model }}/scene.xml
          baseline_root: baseline/${{ matrix.model }}
          candidate_root: candidate/${{ matrix.model }}
          python_version: "3.11"
