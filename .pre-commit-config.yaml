repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy --strict src/metrifid
        entry: python -m mypy --strict src/metrifid
        language: system
        types: [python]
        pass_filenames: false
